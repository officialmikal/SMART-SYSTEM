
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElimuSmart | School Management</title>
    
    <!-- Favicon & Branding -->
    <link rel="icon" type="image/png" href="https://api.dicebear.com/7.x/initials/png?seed=ES&backgroundColor=1e3a8a&fontFamily=Inter&fontSize=45&bold=true&size=64">
    <link rel="apple-touch-icon" href="https://api.dicebear.com/7.x/initials/png?seed=ES&backgroundColor=1e3a8a&fontFamily=Inter&fontSize=45&bold=true&size=192">

    <!-- PWA Primary Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1d4ed8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ElimuSmart">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- html2pdf.js Bundle -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white !important; padding: 0 !important; margin: 0 !important; }
            #root { height: auto !important; overflow: visible !important; }
            .fixed { position: static !important; }
            .bg-gray-900\/90 { background: transparent !important; }
            .shadow-2xl { shadow: none !important; }
            .p-10 { padding: 20px !important; }
            .rounded-\[32px\] { border-radius: 0 !important; border: 1px solid #eee !important; }
        }
        
        .print-only { display: none; }
        
        @keyframes pulse-indigo {
          0%, 100% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.6); transform: scale(1); }
          50% { box-shadow: 0 0 0 10px rgba(79, 70, 229, 0); transform: scale(1.02); }
        }
        .animate-pulse-install {
          animation: pulse-indigo 2s infinite;
        }

        .offscreen-template {
            position: fixed;
            top: 0;
            left: -5000px;
            width: 210mm;
            min-height: 297mm;
            background: white;
            z-index: -9999;
            visibility: visible;
        }

        @media (display-mode: standalone) {
          .pwa-hide { display: none !important; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
